name: Bug report
description: Something in Docket doesn't work as it should
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Windows app, Android app, CLI, AI connector (local), AI connector (remote/Docker), Installer, Docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Docket version
      placeholder: "0.3.0 (docket-mcp --version, or the release you downloaded)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot. Please remove tokens, keys and personal task text.
    validations:
      required: true
  - type: input
    id: ai
    attributes:
      label: AI assistant, if relevant
      placeholder: "claude.ai, Claude Desktop, ChatGPT, LM Studio + Qwen3 8B..."
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text
