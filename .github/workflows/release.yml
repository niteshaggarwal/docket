name: Release

# Push a tag like v0.3.0 to build everything and publish a GitHub release:
#   Windows x64/arm64 zip (app, CLI, connector, installer), connector binaries for Linux and macOS,
#   the Android APK (and AAB when a signing key is set), and the connector image on ghcr.io.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v (a draft release is made)
        required: true

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          v="${v#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "Not a version: $v"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: ./build/publish-windows.ps1 -Out artifacts/windows-${{ matrix.arch }} -Arch ${{ matrix.arch }} -Version ${{ needs.version.outputs.v }} -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: artifacts/docket-*-windows-${{ matrix.arch }}.zip

  connector:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish docket-mcp for ${{ matrix.rid }}
        run: |
          dotnet publish src/Docket.Mcp -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            -p:Version=${{ needs.version.outputs.v }} -o out
          tar -czf docket-mcp-${{ needs.version.outputs.v }}-${{ matrix.rid }}.tar.gz -C out docket-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: connector-${{ matrix.rid }}
          path: docket-mcp-*.tar.gz

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/docket-upload.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key (fine for sideloading, not for Play)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK (and AAB when signed)
        env:
          DOCKET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          DOCKET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          v=${{ needs.version.outputs.v }}
          code=$(( $(date +%s) / 60 ))   # always-increasing versionCode
          sign=""
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            sign="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/docket-upload.keystore -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'docket' }} -p:AndroidSigningKeyPass=env:DOCKET_KEY_PASS -p:AndroidSigningStorePass=env:DOCKET_STORE_PASS"
          fi
          # Release builds make both an AAB (Play) and an APK (direct download); see Docket.Mobile.csproj.
          dotnet publish src/Docket.Mobile -f net10.0-android -c Release \
            -p:ApplicationDisplayVersion=$v -p:ApplicationVersion=$code $sign -o out
          mkdir dist
          cp out/*-Signed.apk "dist/docket-$v-android.apk"
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then cp out/*-Signed.aab "dist/docket-$v-android.aab"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.v }}
          # Drafts (manual runs) don't move :latest.
          tags: |
            ghcr.io/${{ github.repository_owner }}/docket-connector:${{ needs.version.outputs.v }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/docket-connector:latest', github.repository_owner) || '' }}

  release:
    needs: [version, windows, connector, android, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Only our build outputs: docker/build-push-action also uploads a build record (*.dockerbuild)
          # that download-artifact can't extract, which failed the release.
          pattern: '{windows-*,connector-*,android}'
          path: dist
          merge-multiple: true
      - name: Server bundle (compose, Caddyfile, setup script)
        run: |
          v=${{ needs.version.outputs.v }}
          mkdir -p bundle/docket-server
          cp deploy/docker/compose.yaml deploy/docker/Caddyfile deploy/docker/.env.example deploy/docker/setup.sh bundle/docket-server/
          # The bundle uses the published image, so drop the source build section.
          sed -i '/^    build:$/,/^      context: \.\.\/\.\.$/d' bundle/docket-server/compose.yaml
          sed -i "s|^# DOCKET_VERSION=latest.*|DOCKET_VERSION=$v|" bundle/docket-server/.env.example
          chmod +x bundle/docket-server/setup.sh
          tar -czf dist/docket-server-$v.tar.gz -C bundle docket-server
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ needs.version.outputs.v }}
          draft=""; [ "${{ github.event_name }}" = "workflow_dispatch" ] && draft="--draft"
          gh release create "v$v" dist/* $draft --title "Docket $v" --generate-notes --target "${{ github.sha }}"
