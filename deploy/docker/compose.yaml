# Docket self-hosted server: Vikunja (tasks + web UI), the Docket AI connector, and Caddy for automatic HTTPS.
# Quick start: ./setup.sh   (or copy .env.example to .env, fill it in, then: docker compose up -d)
# Docs: docs/self-hosting.md
name: docket

services:
  vikunja:
    image: vikunja/vikunja:${VIKUNJA_VERSION:-2.7.1}
    restart: unless-stopped
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://${DOCKET_DOMAIN}/
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SECRET:?set VIKUNJA_SECRET in .env}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: ${VIKUNJA_REGISTRATION:-true}
      VIKUNJA_SERVICE_TIMEZONE: ${TZ:-Etc/UTC}
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - vikunja-files:/app/vikunja/files
      - vikunja-db:/db
    networks: [internal]

  connector:
    image: ghcr.io/quartifex/docket-connector:${DOCKET_VERSION:-latest}
    build:
      context: ../..
    restart: unless-stopped
    depends_on: [vikunja]
    environment:
      DOCKET_VIKUNJA_URL: http://vikunja:3456
      DOCKET_MCP_KEY: ${DOCKET_MCP_KEY:?set DOCKET_MCP_KEY in .env (openssl rand -hex 32)}
      DOCKET_PUBLIC_URL: https://${DOCKET_DOMAIN}
      DOCKET_DEFAULT_LIST: ${DOCKET_DEFAULT_LIST:-}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - connector-data:/data
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [vikunja, connector]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOCKET_DOMAIN: ${DOCKET_DOMAIN:?set DOCKET_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal:

volumes:
  vikunja-files:
  vikunja-db:
  connector-data:
  caddy-data:
  caddy-config:
